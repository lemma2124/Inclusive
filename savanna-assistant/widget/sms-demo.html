<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMS route demo</title>
  <style>
    :root { --bg:#fff; --fg:#1a1a1a; --muted:#4a4a4a; --accent:#0b5cad; --on:#fff; --panel:#eef1f4; --border:#6b7280; }
    @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#f1f1f1; --muted:#c4c7c5; --accent:#8ab4f8; --on:#0b1b33; --panel:#2a2a2a; --border:#9aa0a6; } }
    * { box-sizing: border-box; }
    body { margin:0; padding:1rem; font-family: system-ui, "Noto Sans Ethiopic", "Nyala", sans-serif; line-height:1.5; background:var(--bg); color:var(--fg); }
    main { max-width: 36rem; margin: 0 auto; }
    [hidden] { display: none !important; }
    label { display:block; font-weight:600; margin-bottom:.25rem; }
    input, textarea, button { font:inherit; }
    input, textarea { width:100%; padding:.625rem; color:var(--fg); background:var(--bg); border:2px solid var(--border); border-radius:.5rem; }
    button { min-height:2.75rem; padding:.5rem 1rem; color:var(--accent); background:var(--bg); border:2px solid var(--accent); border-radius:.5rem; cursor:pointer; }
    button.primary { color:var(--on); background:var(--accent); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, #log:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    .row { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.5rem; }
    .muted { color:var(--muted); font-size:.9375rem; }
    #log { display:flex; flex-direction:column; gap:.5rem; min-height:12rem; max-height:26rem; overflow-y:auto; padding:.5rem; margin:.75rem 0; background:var(--panel); border-radius:.5rem; }
    #log p { margin:0; padding:.5rem .75rem; border-radius:.5rem; max-width:85%; overflow-wrap:anywhere; }
    .them { align-self:flex-start; background:var(--bg); border:2px solid var(--border); }
    .me { align-self:flex-end; background:var(--accent); color:var(--on); }
    #log { display:flex; flex-direction:column; }
  </style>
</head>
<body>
<main>
  <h1>SMS / text route demo</h1>
  <p class="muted">This simulates a feature phone texting the assistant. No real SMS gateway is needed: messages go straight to <code>/v1/sms/inbound</code>, and replies are read back from the console simulator's outbox.</p>

  <form id="login">
    <label for="key">SMS inbound key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false">
    <div class="row"><button type="submit" class="primary">Connect</button></div>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>

  <div id="app" hidden>
    <label for="phone">Your phone number (just for this demo)</label>
    <input id="phone" value="+251911000000">

    <div id="log" role="log" aria-live="polite" aria-label="Text messages" tabindex="0"></div>

    <form id="send">
      <label for="text">Message</label>
      <textarea id="text" rows="2"></textarea>
      <div class="row">
        <button type="submit" class="primary">Send</button>
        <button type="button" data-send="HUMAN">HUMAN</button>
        <button type="button" data-send="YES">YES</button>
        <button type="button" data-send="END">END</button>
        <button type="button" data-send="AM">AM</button>
        <button type="button" data-send="EN">EN</button>
      </div>
    </form>
  </div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var key = '';
  var after = 0;

  function note(cls, text) {
    var p = document.createElement('p');
    p.className = cls;
    p.textContent = text;
    $('log').appendChild(p);
    $('log').scrollTop = $('log').scrollHeight;
  }

  async function api(path, body) {
    var res = await fetch(path, { method: body ? 'POST' : 'GET', headers: { authorization: 'Bearer ' + key, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    var data = await res.json().catch(function () { return null; });
    if (!res.ok) throw new Error((data && data.error && data.error.message) || 'Request failed');
    return data;
  }

  $('login').addEventListener('submit', async function (e) {
    e.preventDefault();
    key = $('key').value.trim();
    if (!key) { $('msg').textContent = 'Enter the SMS inbound key.'; return; }
    try {
      await api('/v1/sms/outbox?after=0');
      $('login').hidden = true;
      $('app').hidden = false;
      $('msg').textContent = '';
      pollLoop();
    } catch (err) { key = ''; $('msg').textContent = err.message; }
  });

  async function sendText(text) {
    if (!text) return;
    note('me', text);
    try { await api('/v1/sms/inbound', { from: $('phone').value.trim(), text: text }); }
    catch (err) { note('them', 'Error: ' + err.message); }
  }

  $('send').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = $('text').value.trim();
    $('text').value = '';
    sendText(text);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-send]'), function (b) {
    b.addEventListener('click', function () { sendText(b.getAttribute('data-send')); });
  });

  async function pollLoop() {
    while (key) {
      try {
        var d = await api('/v1/sms/outbox?after=' + after);
        d.messages.forEach(function (m) {
          after = Math.max(after, m.id);
          if (m.to === $('phone').value.trim()) note('them', m.text);
        });
      } catch (err) { /* keep trying */ }
      await new Promise(function (r) { setTimeout(r, 1500); });
    }
  }
})();
</script>
</body>
</html>
