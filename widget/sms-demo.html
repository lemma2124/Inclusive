<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INCLUSIVE | SMS route demo</title>
  <style>
    :root { color-scheme:light; --bg:#f4f7f4; --fg:#17251f; --muted:#46574f; --accent:#17664f; --on:#fff; --panel:#eaf2ed; --border:#cbd8d0; --surface:#fff; --shadow:0 16px 42px rgba(22,52,39,.08); }
    @media (prefers-color-scheme: dark) { :root { color-scheme:dark; --bg:#101914; --fg:#f0f5f1; --muted:#c0cec4; --accent:#9ad5b5; --on:#102018; --panel:#202f26; --border:#3a4b40; --surface:#18241d; --shadow:0 16px 42px rgba(0,0,0,.22); } }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; padding:clamp(1rem,4vw,3rem); font-family:system-ui,"Noto Sans Ethiopic","Nyala",sans-serif; line-height:1.55; background:radial-gradient(ellipse at 12% 0%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 34rem),var(--bg); color:var(--fg); }
    main { max-width:44rem; margin:0 auto; }
    h1 { margin:0 0 .65rem; font-size:clamp(2rem,4vw,3rem); line-height:1.1; letter-spacing:-.035em; }
    [hidden] { display: none !important; }
    label { display:block; margin-bottom:.35rem; font-weight:650; }
    input, textarea, button { font:inherit; }
    input, textarea { width:100%; padding:.75rem; color:var(--fg); background:var(--surface); border:1px solid var(--border); border-radius:.7rem; }
    button { min-height:2.75rem; padding:.55rem 1rem; color:var(--accent); background:var(--surface); border:1px solid var(--accent); border-radius:.7rem; cursor:pointer; font-weight:650; }
    button:hover { background:var(--panel); }
    button.primary { color:var(--on); background:var(--accent); }
    button.primary:hover { filter:brightness(1.08); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, #log:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    #login, #app { padding:1.25rem; background:var(--surface); border:1px solid var(--border); border-radius:1rem; box-shadow:var(--shadow); }
    #msg { min-height:1.5rem; color:var(--muted); }
    .row { display:flex; flex-wrap:wrap; gap:.55rem; margin-top:.65rem; }
    .muted { color:var(--muted); font-size:.9375rem; }
    #log { display:flex; flex-direction:column; gap:.6rem; min-height:16rem; max-height:32rem; overflow-y:auto; padding:.8rem; margin:.8rem 0 1rem; background:var(--panel); border:1px solid var(--border); border-radius:.75rem; }
    #log p { margin:0; padding:.65rem .8rem; border-radius:.75rem; max-width:88%; overflow-wrap:anywhere; }
    .them { align-self:flex-start; background:var(--surface); border:1px solid var(--border); }
    .me { align-self:flex-end; background:var(--accent); color:var(--on); }
    code { padding:.1rem .35rem; background:var(--panel); border-radius:.3rem; }
    @media (max-width: 32rem) { body { padding:1rem; } #login,#app { padding:1rem; } .row button { flex:1 1 5rem; } }
  </style>
</head>
<body>
<main>
  <h1>INCLUSIVE SMS / text route demo</h1>
  <p class="muted">A safe local simulation of texting the assistant. No real SMS gateway is needed: messages go to <code>/v1/sms/inbound</code>, and replies come from the console simulator's outbox.</p>

  <form id="login">
    <label for="key">SMS inbound key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false">
    <div class="row"><button type="submit" class="primary">Connect</button></div>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>

  <div id="app" hidden>
    <label for="phone">Your phone number (just for this demo)</label>
    <input id="phone" value="+251911000000">

    <div id="log" role="log" aria-live="polite" aria-label="Text messages" tabindex="0"></div>

    <form id="send">
      <label for="text">Message</label>
      <textarea id="text" rows="2"></textarea>
      <div class="row">
        <button type="submit" class="primary">Send</button>
        <button type="button" data-send="HUMAN">HUMAN</button>
        <button type="button" data-send="YES">YES</button>
        <button type="button" data-send="END">END</button>
        <button type="button" data-send="AM">AM</button>
        <button type="button" data-send="EN">EN</button>
      </div>
    </form>
  </div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var key = '';
  var after = 0;

  function note(cls, text) {
    var p = document.createElement('p');
    p.className = cls;
    p.textContent = text;
    $('log').appendChild(p);
    $('log').scrollTop = $('log').scrollHeight;
  }

  async function api(path, body) {
    var res = await fetch(path, { method: body ? 'POST' : 'GET', headers: { authorization: 'Bearer ' + key, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    var data = await res.json().catch(function () { return null; });
    if (!res.ok) throw new Error((data && data.error && data.error.message) || 'Request failed');
    return data;
  }

  $('login').addEventListener('submit', async function (e) {
    e.preventDefault();
    key = $('key').value.trim();
    if (!key) { $('msg').textContent = 'Enter the SMS inbound key.'; return; }
    try {
      await api('/v1/sms/outbox?after=0');
      $('login').hidden = true;
      $('app').hidden = false;
      $('msg').textContent = '';
      pollLoop();
    } catch (err) { key = ''; $('msg').textContent = err.message; }
  });

  async function sendText(text) {
    if (!text) return;
    note('me', text);
    try { await api('/v1/sms/inbound', { from: $('phone').value.trim(), text: text }); }
    catch (err) { note('them', 'Error: ' + err.message); }
  }

  $('send').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = $('text').value.trim();
    $('text').value = '';
    sendText(text);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-send]'), function (b) {
    b.addEventListener('click', function () { sendText(b.getAttribute('data-send')); });
  });

  async function pollLoop() {
    while (key) {
      try {
        var d = await api('/v1/sms/outbox?after=' + after);
        d.messages.forEach(function (m) {
          after = Math.max(after, m.id);
          if (m.to === $('phone').value.trim()) note('them', m.text);
        });
      } catch (err) { /* keep trying */ }
      await new Promise(function (r) { setTimeout(r, 1500); });
    }
  }
})();
</script>
</body>
</html>
